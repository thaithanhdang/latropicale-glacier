<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bons de Commande — La Tropicale Glacier</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--vert:#1e3a2f;--vert-clair:#2d5442;--beige:#f5f0e8;--beige-f:#e8dfc8;--or:#c9a84c;--blanc:#fdfaf4;--texte:#1a2e24;--gris:#6b7c74;--r:10px;--sh:0 2px 16px rgba(30,58,47,.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--beige);color:var(--texte);min-height:100vh}
header{background:var(--vert);color:var(--blanc);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hbrand{display:flex;align-items:center;gap:12px}
.hbrand .logo{width:38px;height:38px;background:var(--or);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.hbrand h1{font-family:'Playfair Display',serif;font-size:18px;font-weight:600}
.hbrand p{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px}
.hback{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;text-decoration:none}
main{max-width:980px;margin:0 auto;padding:24px 16px 60px}
.card{background:var(--blanc);border-radius:var(--r);box-shadow:var(--sh);padding:22px 26px;margin-bottom:20px;border:1px solid var(--beige-f)}
.card h2{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;margin-bottom:14px;color:var(--vert);display:flex;align-items:center;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.g2{grid-template-columns:1fr}}
label{display:block;font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--gris);margin-bottom:5px}
input[type=text],input[type=password],select{width:100%;padding:9px 12px;border:1.5px solid var(--beige-f);border-radius:7px;background:var(--beige);font-family:'DM Mono',monospace;font-size:12px;color:var(--texte);outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--vert-clair);background:#fff}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border:none;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-p{background:var(--vert);color:#fff}.btn-p:hover{background:var(--vert-clair)}
.btn-s{background:var(--beige-f);color:var(--texte)}.btn-s:hover{background:#ddd5bb}
.btn-o{background:var(--or);color:#fff}.btn-o:hover{background:#b8943e}
.btn-sm{padding:6px 12px;font-size:12px}
.sb{display:none;align-items:center;gap:10px;padding:10px 14px;border-radius:7px;font-size:13px;margin-top:12px}
.sb.show{display:flex}
.sb-l{background:#e8f0fe;color:#1a56db;border:1px solid #c3d7fb}
.sb-ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.sb-err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.spin{width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.mc{display:none}.mc.show{display:block}
.mt{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.mt th{text-align:left;padding:8px 11px;background:var(--vert);color:rgba(255,255,255,.85);font-size:10px;letter-spacing:1px;text-transform:uppercase}
.mt th:first-child{border-radius:7px 0 0 0}.mt th:last-child{border-radius:0 7px 0 0}
.mt td{padding:8px 11px;border-bottom:1px solid var(--beige-f);vertical-align:middle}
.mt tr:last-child td{border-bottom:none}.mt tr:nth-child(even) td{background:var(--beige)}
.mt select{padding:4px 7px;font-size:12px;border-radius:5px}
.mt-day-sep td{background:var(--vert-clair)!important;color:#fff;font-weight:600;font-size:11px;padding:6px 11px;letter-spacing:.8px;text-transform:uppercase;border:none}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.bj-lundi{background:#dbeafe;color:#1e40af}.bj-mardi{background:#dcfce7;color:#166534}
.bj-mercredi{background:#fef9c3;color:#854d0e}.bj-jeudi{background:#fce7f3;color:#9d174d}
.bj-vendredi{background:#ede9fe;color:#5b21b6}.bj-samedi{background:#ffedd5;color:#c2410c}
.bj-dimanche{background:#f1f5f9;color:#475569}
.b-ok{background:#ecfdf5;color:#065f46}.b-err{background:#fef2f2;color:#991b1b}
.cs{display:none;margin-top:24px}.cs.show{display:block}
.stitle{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--vert);margin-bottom:4px}
.ssub{color:var(--gris);font-size:13px;margin-bottom:20px}
.tnav{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tbtn{padding:8px 16px;border-radius:6px;border:1.5px solid var(--beige-f);background:var(--blanc);font-size:13px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.tbtn.active{background:var(--vert);color:#fff;border-color:var(--vert)}
.tbtn:hover:not(.active){border-color:var(--vert)}
.tpanel{display:none}.tpanel.active{display:block}
.bc{background:var(--blanc);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px;border:1px solid var(--beige-f);overflow:hidden}
.bch{background:var(--vert);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bch .fn{font-family:'Playfair Display',serif;font-size:16px;font-weight:600}
.bch .fc{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px}
.bch .ji{text-align:right;font-size:11px;color:rgba(255,255,255,.7);line-height:1.7}
.bch .ji strong{color:var(--or)}
.btab{width:100%;border-collapse:collapse;font-size:13px}
.btab th{text-align:left;padding:9px 16px;background:var(--beige);color:var(--gris);font-size:10px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--beige-f)}
.btab td{padding:9px 16px;border-bottom:1px solid var(--beige-f);vertical-align:middle}
.btab tr:last-child td{border-bottom:none}.btab tr:hover td{background:var(--beige)}
.btab tr.day-sep td{background:var(--beige);color:var(--gris);font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:5px 16px;border-bottom:1px solid var(--beige-f)}
.qte{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;color:var(--vert-clair);white-space:nowrap}
.tr{display:inline-block;padding:1px 6px;background:var(--beige-f);border-radius:4px;font-size:10px;margin:1px 2px 1px 0}
.bf{padding:10px 16px;background:var(--beige);border-top:1px solid var(--beige-f);display:flex;justify-content:flex-end;gap:8px}
.del-frais{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;background:#dcfce7;color:#166534;white-space:nowrap}
.del-surgele{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;background:#e0f2fe;color:#0369a1;white-space:nowrap}
.del-jour{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;background:var(--beige-f);color:var(--texte);white-space:nowrap;margin-bottom:2px}
.bio-tag{font-size:9px;font-weight:700;color:#166534;background:#dcfce7;padding:1px 4px;border-radius:3px;margin-left:3px;text-transform:uppercase;letter-spacing:.3px;vertical-align:middle}
.hab-box{padding:12px 18px;background:#f8fdf9;border-bottom:1px solid #c6e9d0}
.hab-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--gris);margin-bottom:8px}
.hab-cols{display:flex;gap:20px;flex-wrap:wrap}
.hab-col{flex:1;min-width:180px}
.hab-col-title{font-size:10px;font-weight:600;color:var(--gris);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.hab-item{display:flex;align-items:center;gap:6px;font-size:11px;padding:2px 0;color:var(--texte)}
.hab-dot-f{width:7px;height:7px;border-radius:50%;background:#16a34a;flex-shrink:0}
.hab-dot-s{width:7px;height:7px;border-radius:50%;background:#0369a1;flex-shrink:0}
.info-envoi{padding:10px 18px;background:#fffbeb;border-bottom:1px solid #fde68a;font-size:12px;color:#92400e;display:flex;align-items:center;gap:8px}
.ec{background:var(--blanc);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px;border:1px solid var(--beige-f);overflow:hidden}
.ech{background:#2d5442;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.ech .et{font-family:'Playfair Display',serif;font-size:15px;font-weight:600}
.ef{padding:14px 20px;border-bottom:1px solid var(--beige-f)}
.efl{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;font-size:13px}
.efl label{min-width:58px;color:var(--gris);font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding-top:2px;font-weight:500;margin-bottom:0}
.efl .v{flex:1}
.eb{padding:14px 20px}
.eb textarea{width:100%;min-height:220px;border:1.5px solid var(--beige-f);border-radius:7px;padding:12px;font-family:'DM Mono',monospace;font-size:12px;line-height:1.6;resize:vertical;background:var(--beige);color:var(--texte)}
.eb textarea:focus{outline:none;border-color:var(--vert-clair);background:#fff}
.ef2{padding:10px 16px;background:var(--beige);border-top:1px solid var(--beige-f);display:flex;gap:8px;justify-content:flex-end}
.pr{background:var(--blanc);border-radius:var(--r);box-shadow:var(--sh);padding:18px 22px;margin-bottom:20px;border:1px solid var(--beige-f)}
.pr h3{font-family:'Playfair Display',serif;font-size:14px;margin-bottom:12px;color:var(--vert)}
.pj{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.pj .jl{width:80px;flex-shrink:0;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--gris);padding-top:3px}
.tp{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:5px;font-size:11px;background:var(--beige-f);margin:2px}
.tp.ok{background:#dcfce7;color:#166534}.tp.nok{background:#fee2e2;color:#991b1b}
.abar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tag-four{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:500;background:#e0f2fe;color:#0369a1;margin-bottom:2px}
.tag-four.prioritaire{background:#dcfce7;color:#166534}
.recap-table{width:100%;border-collapse:collapse;font-size:13px}
.recap-table th{text-align:left;padding:9px 14px;background:var(--vert);color:rgba(255,255,255,.85);font-size:10px;letter-spacing:1px;text-transform:uppercase;position:sticky;top:0}
.recap-table th:first-child{border-radius:7px 0 0 0;width:32px;text-align:center}.recap-table th:last-child{border-radius:0 7px 0 0}
.recap-table td{padding:10px 14px;border-bottom:1px solid var(--beige-f);vertical-align:middle}
.recap-table tr.checked td{background:#f0fdf4;opacity:.65}
.recap-table tr.checked td .ing-nom{text-decoration:line-through;color:var(--gris)}
.recap-table tr:hover td{background:var(--beige)}
.check-cell{text-align:center}
.chk{width:18px;height:18px;cursor:pointer;accent-color:var(--vert)}
.recap-group-header td{background:var(--vert-clair)!important;color:#fff;font-weight:600;font-size:11px;padding:6px 14px;letter-spacing:.5px}
.recap-stats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.recap-stat{background:var(--blanc);border:1px solid var(--beige-f);border-radius:8px;padding:10px 16px;display:flex;flex-direction:column;gap:2px}
.recap-stat .rs-val{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--vert)}
.recap-stat .rs-lbl{font-size:11px;color:var(--gris);text-transform:uppercase;letter-spacing:.5px}
.recap-progress{height:4px;background:var(--beige-f);border-radius:2px;margin-top:4px}
.recap-progress-bar{height:100%;background:var(--vert);border-radius:2px;transition:width .3s}
/* Fiche production */
.fp-wrap{padding:4px 0}
.fp-day{margin-bottom:22px;border:1px solid var(--beige-f);border-radius:var(--r);overflow:hidden;background:var(--blanc);box-shadow:var(--sh)}
.fp-day-header{background:var(--vert);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
.fp-day-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:600}
.fp-day-meta{font-size:11px;color:rgba(255,255,255,.6)}
.fp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0}
.fp-card{padding:12px 14px;border-right:1px solid var(--beige-f);border-bottom:1px solid var(--beige-f);display:flex;flex-direction:column;gap:8px}
.fp-card.done{opacity:.5;background:#f0fdf4}
.fp-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.fp-name{font-size:12px;font-weight:500;color:var(--texte);line-height:1.35;flex:1}
.fp-name.barred{text-decoration:line-through;color:var(--gris)}
.fp-badges{display:flex;flex-wrap:wrap;gap:3px;flex-shrink:0;justify-content:flex-end}
.fp-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;line-height:1.4}
.fp-s{background:#dcfce7;color:#166534}.fp-l{background:#dbeafe;color:#1e40af}.fp-g{background:#fef9c3;color:#854d0e}.fp-v{background:#ede9fe;color:#5b21b6}
.fp-mix{background:var(--beige-f);color:var(--gris);padding:1px 5px;border-radius:3px;font-size:10px;font-weight:500}
.fp-bio{background:#dcfce7;color:#166534;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.fp-ings{list-style:none;flex:1}
.fp-ings li{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:3px 0;border-bottom:1px dotted var(--beige-f);font-size:11px}
.fp-ings li:last-child{border-bottom:none}
.fp-iname{color:var(--texte);flex:1;line-height:1.3}
.fp-iqte{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;color:var(--vert-clair);white-space:nowrap;flex-shrink:0}
.fp-no-ing{font-size:11px;color:var(--gris);font-style:italic;padding:4px 0}
.fp-tops{padding:7px 9px;background:var(--beige);border-radius:6px;font-size:11px}
.fp-top-lbl{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--gris);margin-bottom:5px}
.fp-top-row{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0;border-bottom:1px dotted var(--beige-f)}
.fp-top-row:last-child{border-bottom:none}
.fp-top-nom{flex:1;font-size:11px;color:var(--texte)}
.fp-top-qte{font-family:'DM Mono',monospace;font-size:10px;color:var(--vert-clair);white-space:nowrap}
.fp-no-top{color:var(--gris);font-style:italic;font-size:11px}
.fp-foot{display:flex;align-items:center;gap:6px;padding-top:6px;border-top:1px solid var(--beige-f);margin-top:auto}
.fp-foot input[type=checkbox]{width:15px;height:15px;accent-color:var(--vert);cursor:pointer;flex-shrink:0}
.fp-foot label{font-size:10px;color:var(--gris);cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
.fp-no-rec{font-size:11px;color:#991b1b;padding:8px 0;font-style:italic}
.fp-actions{padding:12px 16px;background:var(--beige);border-top:1px solid var(--beige-f);display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.fp-actions-meta{font-size:12px;color:var(--gris)}
#toast{position:fixed;bottom:20px;right:20px;background:var(--vert);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.2);transform:translateY(60px);opacity:0;transition:all .3s;z-index:999}
#toast.show{transform:translateY(0);opacity:1}
@media print{
  header,.card,.mc,.abar,.bf,.ef2,.tnav,.recap-stats,.fp-foot,.fp-actions{display:none!important}
  .cs{display:block!important}.tpanel{display:none!important}.tpanel.active{display:block!important}
  body{background:white}.bc,.fp-day{page-break-inside:avoid;box-shadow:none;border:1px solid #ddd}
  .bch,.fp-day-header,.ech,.hab-box,.info-envoi{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .fp-grid{display:grid;grid-template-columns:repeat(3,1fr)}.fp-card{border:1px solid #eee;page-break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <div class="hbrand">
    <div class="logo">🍦</div>
    <div><h1>La Tropicale Glacier</h1><p>Bons de commande</p></div>
  </div>
  <a href="https://latropicale-glacier.vercel.app" class="hback">← Retour à l'app</a>
</header>
<main>
<div class="card">
  <h2>⚙️ Configuration</h2>
  <div class="g2">
    <div><label>URL Supabase</label><input type="text" id="supabaseUrl" value="https://bedunhjdbfxguvtzxdha.supabase.co"></div>
    <div><label>Clé anon (Publishable key)</label><input type="password" id="supabaseKey" value="sb_publishable_1fY44lTPE5ArvGQBm3pHRQ_NyDcBuSO"></div>
  </div>
  <div style="margin-top:12px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">

<script>
const SHEET_ID='1IJ_I-JxafJpIF9H2pInXaET-IQw0KrTialE94rL2hoI';
const GOOGLE_API_KEY='AIzaSyBhYu07yyGNafYNCMkiA6Oit8ZpO4WxdA8';
const ORDRE_JOURS=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const FOURNISSEURS_PRIORITAIRES=['fromentellerie','dipsa','gamme','metro','tang','paris store','top asia'];
// Fournisseurs avec colonne "Livraison le [jour]" (bon unique envoyé le lundi)
const FOURNISSEURS_LIVRAISON_JOUR=['dipsa','gamme'];

const EXCLUSIONS_BASE=[
  n=>n==='lin'||n==='farine de lin'||(n.includes('lin')&&(n.includes('farine')||n.includes('mixeo'))),
  n=>n.includes('mixeo'),
  n=>n.includes('guar')&&!n.includes('guarana'),
  n=>n==='sucre'||(n.includes('sucre')&&n.includes('canne')),
  n=>n.includes('poudre')&&n.includes('lait'),
  n=>n==='eau',
  n=>(n==='lait'||n.includes('lait entier'))&&!n.includes('coco')&&!n.includes('soja'),
  n=>n.includes('creme')&&(n.includes('crue')||n.includes('fraiche')||n.includes('fraîche')),
  n=>n.includes('sirop')&&n.includes('agave')||n==='agave',
  n=>n.includes('inuline'),
  n=>n.includes('glucose'),
];

// Purées fraîches chez DIPSA : livraison le jour J de la production
// Purées fraîches DIPSA : livraison le jour J de la production
const DIPSA_FRAIS_KEYS=[
  // Frais 1 kg — livraison le jour J de la production
  'framboise bio','fruit de la passion bio','passion bio',
  'mangue alphonso bio',
  'litchi',
  'citron jaune bio','citron bio','puree citron','purée citron',
  'poivron rouge','poivron',
];
// Clés surgelées DIPSA (tout ce qui n'est pas dans FRAIS_KEYS)
// citron bergamotte → surgelé 1 kg
const DIPSA_SURGELE_KEYS=['citron bergamotte','bergamotte'];

// Items DIPSA disponibles en FRAIS (1 kg) ET SURGELÉ (5 kg) → split auto
// Règle : floor(qty/5)*5 kg en surgelé + reste en frais
const DIPSA_DUAL_KEYS=['framboise bio','passion bio','fruit de la passion bio','litchi'];
const DIPSA_SURGELE_UNIT=5; // kg par colis surgelé

// Colisage Gamme des Chefs
const GAMME_PUREE_COLIS=6;  // purées : 6×1 kg
const GAMME_BILLE_COLIS=5;  // fruits en bille : 5×1 kg

const HABITUELS={
  dipsa:{
    frais:[
      'Framboise bio (1 kg)','Fruit de la Passion bio (1 kg)',
      'Mangue Alphonso bio (1 kg)','Litchi frais (1 kg)',
      'Citron jaune bio (1 kg)','Poivron rouge (1 kg)'
    ],
    surgele:[
      'Passion bio (5 kg)','Framboise bio (5 kg)','Litchi (5 kg)',

function ss(msg,type='l'){const b=document.getElementById('statusBar');b.className='sb show sb-'+(type==='l'?'l':type==='ok'?'ok':'err');b.innerHTML=type==='l'?`<div class="spin"></div><span>${msg}</span>`:`<span>${type==='ok'?'✅':'❌'}</span><span>${msg}</span>`}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function norm(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,'').trim()}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):''}
function fqte(n){if(!n)return'0';if(Number.isInteger(n))return''+n;return n.toFixed(n<1?3:n<10?2:1).replace(/.?0+$/,'')}
function toGrams(q,u){const un=norm(u||'g').replace(/[^a-z]/g,'');if(un==='kg')return q*1000;if(un==='l')return q*1000;if(un==='ml')return q;return q;}
function fromGrams(g){if(g>=1000)return{q:parseFloat((g/1000).toFixed(3)),u:'kg'};return{q:parseFloat(g.toFixed(1)),u:'g'};}
function pdate(nom){const m=nom.match(/(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);if(!m)return null;let y=m[3]?parseInt(m[3]):new Date().getFullYear();if(y<100)y+=2000;return new Date(y,parseInt(m[2])-1,parseInt(m[1]))}
function estPrioritaire(nom){const n=norm(nom||'');return FOURNISSEURS_PRIORITAIRES.some(k=>n.includes(k))}
function estLivraisonJour(nom){const n=norm(nom||'');return FOURNISSEURS_LIVRAISON_JOUR.some(k=>n.includes(k))}
function estBaseExclue(nom){const n=norm(nom||'');return EXCLUSIONS_BASE.some(f=>f(n))}
function jourPrecedent(jour){const i=ORDRE_JOURS.indexOf(jour);return i>0?ORDRE_JOURS[i-1]:'dimanche'}
function isDipsaDual(ingNom){
  const n=norm(ingNom);
  return DIPSA_DUAL_KEYS.some(k=>n.includes(norm(k)));
}
function estBilleGamme(ingNom){const n=norm(ingNom);return n.includes('bille')||n.includes('billes')}
function estPureeGamme(ingNom){const n=norm(ingNom);return n.includes('puree')||n.includes('purée')}

// Date réelle d'un jour de la semaine à partir de S.semaine (format DD/MM/YY = lundi)
function dateDeJour(jourNom){
  const idx=ORDRE_JOURS.indexOf(jourNom); // lundi=0
  if(idx<0||!S.semaine)return cap(jourNom);
  const parts=S.semaine.split('/');
  if(parts.length<3)return cap(jourNom);
  const[d,m,y]=parts;
  const lundi=new Date(`20${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`);
  lundi.setDate(lundi.getDate()+idx);
  const dd=String(lundi.getDate()).padStart(2,'0');
  const mm=String(lundi.getMonth()+1).padStart(2,'0');
  return`${cap(jourNom)} ${dd}/${mm}`;
}

function isDipsaFrais(ingNom){
  const n=norm(ingNom);
  // Explicitement surgelé → surgelé
  if(DIPSA_SURGELE_KEYS.some(k=>n.includes(norm(k))))return false;
  // Purées de fruit et fruits en bille → surgelé par défaut sauf si dans FRAIS_KEYS
  const estPureeBille=n.includes('puree')||n.includes('purée')||n.includes('bille')||n.includes('billes');
  if(estPureeBille&&!DIPSA_FRAIS_KEYS.some(k=>n.includes(norm(k))))return false;
  return DIPSA_FRAIS_KEYS.some(k=>n.includes(norm(k)));
}

function getHabBox(fouNom){
  const fn=norm(fouNom||'');
  let hab=null;
  if(fn.includes('dipsa'))hab=HABITUELS.dipsa;

  let cols='';

  return`<div class="hab-box"><div class="hab-title">Commandes habituelles</div><div class="hab-cols">${cols}</div></div>`;
}

async function chargerSupa(url,key){
  const base=url.replace(/\/$/,'');
  const[rec,ing,fou]=await Promise.all([supaGet(base,key,'recettes','order=nom&select=*'),supaGet(base,key,'ingredients','order=nom_recette&select=*'),supaGet(base,key,'fournisseurs','order=nom&select=*')]);
  S.recettes=rec.map(r=>({id:r.id,nom:r.nom||r.nom_recette||'',categorie:r.categorie||'',poudres:r.poudres||[],liquides:r.liquides||[],ingredients:r.ingredients||[],toppings:r.toppings||[]}));
  S.ingredients=ing.map(i=>({id:i.id,nomRecette:i.nom_recette||i.nomRecette||'',nomEtiquette:i.nom_etiquette||i.nomEtiquette||'',fournisseurId:i.fournisseur_id||i.fournisseurId||'',unite:i.unite||'kg',bio:i.bio||false}));
  S.fournisseurs=fou.map(f=>({id:f.id,nom:f.nom||'',contact:f.contact||'',jourCommande:f.jour_commande||f.jourCommande||'',jourLivraison:f.jour_livraison||f.jourLivraison||''}));
}

function parseCSV(csv){
  const rows=[];let cur='',inQ=false,cols=[];
  for(let i=0;i<csv.length;i++){const ch=csv[i],nx=csv[i+1];
    if(ch==='"'){if(inQ&&nx==='"'){cur+='"';i++}else inQ=!inQ}
    else if(ch===','&&!inQ){cols.push(cur.trim());cur=''}
    else if((ch==='\n'||ch==='\r')&&!inQ){if(ch==='\r'&&nx==='\n')i++;cols.push(cur.trim());rows.push(cols);cols=[];cur=''}
    else cur+=ch}
  if(cur||cols.length){cols.push(cur.trim());rows.push(cols)}return rows;
}

async function chargerPlanning(gid){
  const r=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`);
  if(!r.ok)throw new Error(`Sheet inaccessible (${r.status})`);
  const csv=await r.text();const lignes=parseCSV(csv);S.planning=[];
  let jour='',date='';
  for(const l of lignes.slice(15,80)){
    const A=(l[0]||'').trim(),B=(l[1]||'').trim(),C=(l[2]||'').trim(),D=(l[3]||'').trim(),E=(l[4]||'').trim();
    if(ORDRE_JOURS.includes(A.toLowerCase())){jour=A.toLowerCase();date=''}
    else if(A&&/^\d{1,2}[\/\-]\d{1,2}/.test(A))date=A;
    if(B.toUpperCase()==='OFF')continue;
    if(jour&&C&&C.toLowerCase()!=='parfums'){
      let p=C,mx=1;const mX=p.match(/\s+[Xx]\s*(\d+)$/);
      if(mX){mx=parseInt(mX[1]);p=p.replace(/\s+[Xx]\s*\d+$/,'').trim()}
      const ex=S.planning.find(x=>x.parfum===p&&x.jour===jour);
      if(ex){ex.mixCount+=mx}else{S.planning.push({jour,date,parfum:p,mixCount:mx,qteOutput:D,sgl:E})}
    }
  }
  const sel=document.getElementById('semaineSelect');S.semaine=sel.options[sel.selectedIndex]?.text||'';
}

function fuzzy(parfum){
  const nk=norm(parfum),mots=nk.split(/\s+/).filter(m=>m.length>2);
  for(const r of S.recettes)if(norm(r.nom)===nk)return r.id;
  for(const r of S.recettes){const nr=norm(r.nom);if(mots.length>0&&mots.every(m=>nr.includes(m)))return r.id}
  for(const r of S.recettes){const mr=norm(r.nom).split(/\s+/).filter(m=>m.length>2);if(mr.length>0&&mr.every(m=>nk.includes(m)))return r.id}
  let best=0,bid=null;
  for(const r of S.recettes){const sc=mots.filter(m=>norm(r.nom).includes(m)).length;if(sc>best){best=sc;bid=r.id}}
  if(best>=1&&mots.length<=2)return bid;return null;
}

function afficherMapping(){
  const pu=[...new Map(S.planning.map(p=>[p.parfum,p])).values()]

// ── Calcul des lignes de commande pour DIPSA/Gamme ──
// Retourne une liste de lignes triées par jour de livraison
// Chaque ligne = { ing, livraisonJour, type, q, u, recs (avec jour de production) }
function buildLivraisonLines(fouId, fouNom){
  // Clé de regroupement : iid + livraisonJour + type (frais/surgelé)
  const map={};
  for(const prod of S.planning){
    const rid=S.mapping[norm(prod.parfum)];if(!rid)continue;
    const rec=S.recettes.find(r=>r.id===rid);if(!rec)continue;
    const mx=prod.mixCount||1;
    for(const l of [...(rec.poudres||[]),...(rec.liquides||[]),...(rec.ingredients||[]),...(rec.toppings||[])]){
      const iid=l.ingredientId||l.ingredient_id;
      const ing=S.ingredients.find(i=>i.id===iid);
      if(!ing||ing.fournisseurId!==fouId)continue;
      const fn=norm(fouNom);
      let frais=fn.includes('dipsa')?isDipsaFrais(ing.nomRecette):false;
      // Gamme des Chefs : toujours surgelé
      let type=frais?'frais':'surgele';
      // Livraison = J si frais, J-1 si surgelé
      let livraisonJour=frais?prod.jour:jourPrecedent(prod.jour);
      // Règle : première livraison possible = MARDI (commande envoyée lundi matin)
      // Si J-1 = lundi → livraison lundi impossible → forcer frais livraison mardi
      if(livraisonJour==='lundi'){
        livraisonJour=prod.jour; // = mardi au plus tôt
        type='frais';
        frais=true;
      }
      const key=`${iid}__${livraisonJour}__${type}`;
      if(!map[key])map[key]={ing,livraisonJour,type,g:0,recs:[]};
      map[key].g+=toGrams((parseFloat(l.poids)||0)*mx, l.unite||'g');
      // Mémoriser le parfum avec son jour de production
      const label=`${prod.parfum} (${cap(prod.jour)})`;
      if(!map[key].recs.includes(label))map[key].recs.push(label);
    }
  }
  // Post-processing : split DIPSA dual, arrondi colisage Gamme
  const fn2=norm(fouNom);
  const finalEntries=[];
  for(const item of Object.values(map)){
    if(fn2.includes('dipsa')&&isDipsaDual(item.ing.nomRecette)&&item.type==='frais'){
      // Split : multiples de 5kg en surgelé + reste en frais
      const totalKg=item.g/1000;
      const prodJour=item.livraisonJour; // pour frais, livraisonJour=prodJour
      const surgeleJour=jourPrecedent(prodJour);
      if(surgeleJour==='lundi'){
        // Lundi impossible → tout en frais (ex: production mardi)
        finalEntries.push({...item});
      } else {
        const surgeleKg=Math.floor(totalKg/DIPSA_SURGELE_UNIT)*DIPSA_SURGELE_UNIT;
        const fraisKg=parseFloat((totalKg-surgeleKg).toFixed(3));
        if(surgeleKg>0){
          const nbSacs=surgeleKg/DIPSA_SURGELE_UNIT;
          finalEntries.push({...item,type:'surgele',livraisonJour:surgeleJour,g:surgeleKg*1000,colisageDisplay:`${nbSacs}×5kg`,neededKg:parseFloat(totalKg.toFixed(3))});
          if(fraisKg>0)finalEntries.push({...item,type:'frais',livraisonJour:prodJour,g:fraisKg*1000});
        } else {
          finalEntries.push({...item}); // qty < 5kg → tout en frais
        }
      }
    } else if(fn2.includes('gamme')){
      // Arrondir au colisage supérieur
      const kg=item.g/1000;
      let colisageKg=0,colisageLbl='';
      if(estBilleGamme(item.ing.nomRecette)){colisageKg=GAMME_BILLE_COLIS;colisageLbl=`${GAMME_BILLE_COLIS}×1kg`;}
      else if(estPureeGamme(item.ing.nomRecette)){colisageKg=GAMME_PUREE_COLIS;colisageLbl=`${GAMME_PUREE_COLIS}×1kg`;}
      if(colisageKg>0){
        const nbColis=Math.ceil(kg/colisageKg);
        const orderedKg=nbColis*colisageKg;
        const colisageDisplay=`${nbColis}×${colisageLbl}`;
        finalEntries.push({...item,g:orderedKg*1000,colisageDisplay,neededKg:parseFloat(kg.toFixed(3))});
      } else {
        finalEntries.push(item);
      }
    } else {
      finalEntries.push(item);
    }
  }
  // Convertir grammes → kg et trier par jour de livraison
  return finalEntries.map(item=>{
    const {q,u}=fromGrams(item.g);
    return {...item,q,u};
  }).sort((a,b)=>{
    const di=ORDRE_JOURS.indexOf(a.livraisonJour)-ORDRE_JOURS.indexOf(b.livraisonJour);
    return di!==0?di:(a.ing.nomRecette+a.type).localeCompare(b.ing.nomRecette+b.type);
  });
}

function genererCommandes(){
  const bMap={};
  for(const prod of S.planning){
    const rid=S.mapping[norm(prod.parfum)];if(!rid)continue;
    const rec=S.recettes.find(r=>r.id===rid);if(!rec)continue;
    const mx=prod.mixCount||1;
    for(const l of [...(rec.poudres||[]),...(rec.liquides||[]),...(rec.ingredients||[]),...(rec.toppings||[])]){
      const iid=l.ingredientId||l.ingredient_id;if(!iid)continue;
      const p=parseFloat(l.poids)||0;
      if(!bMap[iid])bMap[iid]={g:0,recs:new Set()};
      bMap[iid].g+=toGrams(p*mx,l.unite||'g');bMap[iid].recs.add(prod.parfum);
    }
  }
  const parFour={};const divers=[];
  for(const[iid,b] of Object.entries(bMap)){
    const ing=S.ingredients.find(i=>i.id===iid);if(!ing)continue;
    const {q,u}=fromGrams(b.g);
    const item={ing,qte:q,u,recs:[...b.recs]};
    const fou=S.fournisseurs.find(f=>f.id===ing.fournisseurId);
    const fouNom=fou?.nom||'';
    // DIPSA et Gamme ont leur propre bon avec colonnes livraison — on les inclut quand même dans parFour pour le récap
    if(fou&&estPrioritaire(fouNom)){if(!parFour[fou.id])parFour[fou.id]={fou,lignes:[]};parFour[fou.id].lignes.push(item)}
    else divers.push({item,fouNom,fou});
  }
  afficherResultats(parFour,divers);
}

function afficherResultats(parFour,divers){
  const pj={};for(const p of S.planning){if(!pj[p.jour])pj[p.jour]=[];pj[p.jour].push(p)}
  let rh='<h3>📅 Planning de la semaine</h3>';
  for(const j of ORDRE_JOURS){if(!pj[j])continue;
    rh+=`<div class="pj"><span class="jl">${cap(j)}</span><div>${pj[j].map(p=>{const ok=!!S.mapping[norm(p.parfum)];return`<span class="tp ${ok?'ok':'nok'}">${ok?'✓':'⚠'} ${p.parfum}${p.mixCount>1?` ×${p.mixCount}`:''}</span>`}).join('')}</div></div>`}
  document.getElementById('pr').innerHTML=rh;
  const tnav=document.getElementById('tnav'),tc=document.getElementById('tc');
  tnav.innerHTML='';tc.innerHTML='';const tabs=[];

  tabs.push({id:'fiche',label:'Fiche de production',icon:'📋',html:ficheProductionHtml()});

  // Bons fournisseurs : DIPSA et Gamme avec colonnes livraison, les autres standard
  for(const fou of S.fournisseurs.filter(f=>parFour[f.id])){
    if(estLivraisonJour(fou.nom)){
      const lines=buildLivraisonLines(fou.id,fou.nom);
      if(lines.length)tabs.push({id:`f_${fou.id}`,label:fou.nom,icon:'📅',html:bonLivraisonHtml(fou,lines)});
    } else {
      tabs.push({id:`f_${fou.id}`,label:fou.nom,icon:'📦',html:bonHtml(parFour[fou.id])});
    }
  }

  if(divers.length)tabs.push({id:'divers',label:'Autres fournisseurs',icon:'🛒',html:diversHtml(divers)});
  const eh=emailsHtml(parFour);if(eh)tabs.push({id:'emails',label:'Emails fournisseurs',icon:'✉️',html:eh});
  tabs.push({id:'recap',label:'Récapitulatif veille',icon:'✅',html:recapHtml(parFour,divers)});

  tabs.forEach((tab,i)=>{
    const btn=document.createElement('button');btn.className='tbtn'+(i===0?' active':'');btn.textContent=`${tab.icon} ${tab.label}`;btn.onclick=()=>activerTab(tab.id);tnav.appendChild(btn);
    const panel=document.createElement('div');panel.className='tpanel'+(i===0?' active':'');panel.id=`p_${tab.id}`;panel.innerHTML=tab.html;tc.appendChild(panel);
  });

  const cs=document.getElementById('cs');cs.classList.add('show');
  document.getElementById('stitle').textContent=`Semaine ${S.semaine}`;
  document.getElementById('ssub').textContent=`${S.planning.length} productions · ${new Date().toLocaleDateString('fr-FR')}`;
  cs.scrollIntoView({behavior:'smooth'});toast(`${tabs.length} sections générées ✓`);
}

function activerTab(id){
  document.querySelectorAll('.tbtn').forEach((b,i)=>{const panels=document.querySelectorAll('.tpanel');const pid=panels[i]?.id?.replace('p_','');b.classList.toggle('active',pid===id)});
  document.querySelectorAll('.tpanel').forEach(p=>p.classList.toggle('active',p.id===`p_${id}`));
}

// ── Bon avec colonne "Livraison le [jour]" (DIPSA / Gamme) ──
function bonLivraisonHtml(fou,lines){
  // Grouper les lignes par jour de livraison pour les séparateurs visuels
  let lastJour='';
  const rows=lines.map(line=>{
    const qFmt=fqte(line.q);
    const typeTag=line.type==='frais'
      ?'<span class="del-frais">🟢 Frais</span>'
      :'<span class="del-surgele">❄️ Surgelé</span>';
    let sep='';
    if(line.livraisonJour!==lastJour){
      lastJour=line.livraisonJour;
      sep=`<tr class="day-sep"><td colspan="5">📅 Livraison ${cap(line.livraisonJour)}</td></tr>`;
    }
    const colisageTd=line.colisageDisplay
      ?`<td><strong style="font-family:'DM Mono',monospace;font-size:12px">${line.colisageDisplay}</strong>${line.neededKg?` <span style="font-size:11px;color:var(--gris)">(besoin : ${fqte(line.neededKg)} kg)</span>`:''}</td>`
      :`<td></td>`;
    return sep+`<tr>
      <td><div style="font-weight:500">${line.ing.nomRecette}${line.ing.bio?'<span class="bio-tag">BIO</span>':''}</div><div style="font-size:11px;color:var(--gris)">${line.ing.nomEtiquette||''}</div></td>
      <td>${typeTag}</td>
      <td><span class="qte">${qFmt} ${line.u}</span></td>
      ${colisageTd}
      <td>${line.recs.map(r=>`<span class="tr">${r}</span>`).join('')}</td>
    </tr>`;
  }).join('');

  // Données pour copier/email
  const dl=JSON.stringify(lines.map(l=>({n:l.ing.nomRecette,bio:l.ing.bio,lj:l.livraisonJour,type:l.type,q:fqte(l.q),u:l.u,recs:l.recs}))).replace(/'/g,'&#39;');

  return`<div class="bc" data-fn="${fou.nom}" data-dl='${dl}'>
    <div class="bch">
      <div><div class="fn">${fou.nom}</div><div class="fc">${fou.contact||''}</div></div>
      <div class="ji"><div>📤 Envoi : <strong>Lundi matin</strong></div><div>Livraisons planifiées par jour</div></div>
    </div>
    <div class="info-envoi">📬 Bon de commande unique envoyé le lundi — les dates de livraison souhaitées sont précisées ligne par ligne.</div>
    ${getHabBox(fou.nom)}
    <table class="btab">
      <thead><tr><th>Ingrédient</th><th>Type</th><th>Qté commandée</th><th>Colisage</th><th>Pour les recettes</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="bf">
      <button class="btn btn-s btn-sm" onclick="copierBonLivraison(this)">📋 Copier ce bon</button>
    </div>
  </div>`;
}

// ── Bon standard (autres fournisseurs prioritaires) ──
function bonHtml({fou,lignes}){
  const rows=lignes.map(l=>`<tr><td><div style="font-weight:500">${l.ing.nomRecette}${l.ing.bio?'<span class="bio-tag">BIO</span>':''}</div><div style="font-size:11px;color:var(--gris)">${l.ing.nomEtiquette||''}</div></td><td><span class="qte">${fqte(l.qte)} ${l.u}</span></td><td>${l.recs.map(r=>`<span class="tr">${r}</span>`).join('')}</td></tr>`).join('');
  const dl=JSON.stringify(lignes.map(l=>({n:l.ing.nomRecette,q:fqte(l.qte),u:l.u}))).replace(/'/g,'&#39;');
  return`<div class="bc" data-fn="${fou.nom}" data-dl='${dl}'><div class="bch"><div><div class="fn">${fou.nom}</div><div class="fc">${fou.contact||''}</div></div><div class="ji">${fou.jourCommande?`<div>📤 Commande : <strong>${cap(fou.jourCommande)}</strong></div>`:''} ${fou.jourLivraison?`<div>📦 Livraison : <strong>${cap(fou.jourLivraison)}</strong></div>`:''}</div></div><table class="btab"><thead><tr><th>Ingrédient</th><th>Quantité</th><th>Pour les recettes</th></tr></thead><tbody>${rows}</tbody></table><div class="bf"><button class="btn btn-s btn-sm" onclick="copierBon(this)">📋 Copier ce bon</button></div></div>`;
}

function diversHtml(divers){
  const sorted=[...divers].sort((a,b)=>(a.fouNom||'').localeCompare(b.fouNom||'')||(a.item.ing.nomRecette||'').localeCompare(b.item.ing.nomRecette||''));
  const rows=sorted.map(({item:l,fouNom})=>`<tr><td><div style="font-weight:500">${l.ing.nomRecette}${l.ing.bio?'<span class="bio-tag">BIO</span>':''}</div><div style="font-size:11px;color:var(--gris)">${l.ing.nomEtiquette||''}</div></td><td><span class="tag-four">${fouNom||'Non défini'}</span></td><td><span class="qte">${fqte(l.qte)} ${l.u}</span></td><td>${l.recs.map(r=>`<span class="tr">${r}</span>`).join('')}</td></tr>`).join('');
  const dl=JSON.stringify(sorted.map(({item:l,fouNom})=>({n:l.ing.nomRecette,f:fouNom,q:fqte(l.qte),u:l.u}))).replace(/'/g,'&#39;');
  return`<div class="bc" data-fn="Autres fournisseurs" data-dl='${dl}'><div class="bch" style="background:#4a7060"><div><div class="fn">🛒 Autres fournisseurs</div><div class="fc">${sorted.length} ingrédient(s)</div></div></div><table class="btab"><thead><tr><th>Ingrédient</th><th>Fournisseur</th><th>Quantité</th><th>Pour les recettes</th></tr></thead><tbody>${rows}</tbody></table><div class="bf"><button class="btn btn-s btn-sm" onclick="copierDivers(this)">📋 Copier</button></div></div>`;
}

// ── Fiche de production ──
function ficheProductionHtml(){
  const pj={};for(const p of S.planning){if(!pj[p.jour])pj[p.jour]=[];pj[p.jour].push(p)}
  let html='<div class="fp-wrap">',fpIdx=0;
  for(const jour of ORDRE_JOURS){
    if(!pj[jour])continue;const prods=pj[jour];let cardsHtml='';
    for(const prod of prods){
      const uid=`fp${fpIdx++}`;
      const rid=S.mapping[norm(prod.parfum)];const rec=rid?S.recettes.find(r=>r.id===rid):null;
      const mx=prod.mixCount||1;const isBio=/bio/i.test(prod.parfum)||(rec&&/bio/i.test(rec.nom));
      const sgl=(prod.sgl||'').toUpperCase().trim();const sglCls={'S':'fp-s','L':'fp-l','G':'fp-g','V':'fp-v'}[sgl]||'fp-s';
      const sglBadge=sgl?`<span class="fp-badge ${sglCls}">${sgl}</span>`:'';
      const mixBadge=mx>1?`<span class="fp-mix">×${mx}</span>`:'';
      const bioBadge=isBio?`<span class="fp-bio">BIO</span>`:'';
      if(!rec){cardsHtml+=`<div class="fp-card"><div class="fp-card-top"><div class="fp-name">${prod.parfum}</div><div class="fp-badges">${bioBadge}${sglBadge}${mixBadge}</div></div><p class="fp-no-rec">⚠ Recette non associée</p></div>`;continue}
      const ingsSpec=[];
      for(const l of [...(rec.poudres||[]),...(rec.liquides||[]),...(rec.ingredients||[])]){
        const iid=l.ingredientId||l.ingredient_id;const ing=S.ingredients.find(i=>i.id===iid);
        if(!ing||estBaseExclue(ing.nomRecette))continue;
        let q=(parseFloat(l.poids)||0)*mx,u=l.unite||'g';
        const cI=fromGrams(toGrams(q,u));
        ingsSpec.push({nom:ing.nomRecette,bio:ing.bio,qte:fqte(cI.q),u:cI.u});
      }
      const tops=[];
      for(const l of (rec.toppings||[])){
        const iid=l.ingredientId||l.ingredient_id;const ing=S.ingredients.find(i=>i.id===iid);if(!ing)continue;
        let q=(parseFloat(l.poids)||0)*mx,u=l.unite||'g';
        const cT=fromGrams(toGrams(q,u));
        tops.push({nom:ing.nomRecette,bio:ing.bio,qte:fqte(cT.q),u:cT.u});
      }
      const ingRows=ingsSpec.length?ingsSpec.map(i=>`<li><span class="fp-iname">${i.nom}${i.bio?'<span class="bio-tag" style="margin-left:3px">BIO</span>':''}</span><span class="fp-iqte">${i.qte} ${i.u}</span></li>`).join(''):`<li><span class="fp-no-ing">Pas d'ingrédient spécifique</span></li>`;
      const topSection=tops.length?`<div class="fp-tops"><span class="fp-top-lbl">Toppings</span>${tops.map(t=>`<div class="fp-top-row"><span class="fp-top-nom">${t.nom}${t.bio?'<span class="bio-tag" style="margin-left:3px">BIO</span>':''}</span><span class="fp-top-qte">${t.qte} ${t.u}</span></div>`).join('')}</div>`:`<div class="fp-tops"><span class="fp-top-lbl">Toppings</span><span class="fp-no-top">Aucun</span></div>`;
      cardsHtml+=`<div class="fp-card" id="fpcard_${uid}"><div class="fp-card-top"><div class="fp-name" id="fpname_${uid}">${prod.parfum}</div><div class="fp-badges">${bioBadge}${sglBadge}${mixBadge}</div></div><ul class="fp-ings">${ingRows}</ul>${topSection}<div class="fp-foot"><input type="checkbox" id="${uid}" onchange="toggleFp('${uid}')"><label for="${uid}">Ingrédients prêts ✓</label></div></div>`;
    }
    html+=`<div class="fp-day"><div class="fp-day-header"><span class="fp-day-name">${cap(jour)}</span><span class="fp-day-meta">${prods.length} turbinage${prods.length>1?'s':''}</span></div><div class="fp-grid">${cardsHtml}</div><div class="fp-actions"><span class="fp-actions-meta" id="fpday_${jour}">0 / ${prods.length} prêts</span><button class="btn btn-s btn-sm" onclick="toutCocherJour('${jour}')">✅ Tout cocher</button></div></div>`;
  }
  return html+'</div>';
}

function toggleFp(uid){const chk=document.getElementById(uid);const card=document.getElementById(`fpcard_${uid}`);const name=document.getElementById(`fpname_${uid}`);if(card)card.classList.toggle('done',chk.checked);if(name)name.classList.toggle('barred',chk.checked);majFpCompteurs()}
function majFpCompteurs(){const pj={};for(const p of S.planning){if(!pj[p.jour])pj[p.jour]=[];pj[p.jour].push(p)}let fpIdx=0;for(const jour of ORDRE_JOURS){if(!pj[jour])continue;const nb=pj[jour].length;let done=0;for(let i=0;i<nb;i++){const c=document.getElementById(`fp${fpIdx+i}`);if(c?.checked)done++}const el=document.getElementById(`fpday_${jour}`);if(el)el.textContent=`${done} / ${nb} prêts`;fpIdx+=nb}}
function toutCocherJour(jour){const pj={};for(const p of S.planning){if(!pj[p.jour])pj[p.jour]=[];pj[p.jour].push(p)}let fpIdx=0;for(const j of ORDRE_JOURS){if(!pj[j])continue;if(j===jour){for(let i=0;i<pj[j].length;i++){const id=`fp${fpIdx+i}`;const c=document.getElementById(id);if(c&&!c.checked){c.checked=true;toggleFp(id)}}break}fpIdx+=pj[j].length}}

// ── Récapitulatif veille ──
function recapHtml(parFour,divers){
  const tous=[];
  for(const fid of Object.keys(parFour)){const{fou,lignes}=parFour[fid];for(const l of lignes)tous.push({item:l,fouNom:fou.nom,fouPrio:true})}
  for(const{item,fouNom}of divers)tous.push({item,fouNom,fouPrio:false});
  const parFourNom={};for(const e of tous){const k=e.fouNom||'Non défini';if(!parFourNom[k])parFourNom[k]={prio:e.fouPrio,items:[]};parFourNom[k].items.push(e)}
  const groupes=Object.entries(parFourNom).sort(([an,a],[bn,b])=>(b.prio-a.prio)||an.localeCompare(bn));
  const total=tous.length;let rows='',idx=0;
  for(const[fnm,grp]of groupes){
    rows+=`<tr class="recap-group-header"><td colspan="5">${grp.prio?'📦':'🛒'} ${fnm}</td></tr>`;
    for(const{item:l}of grp.items){const uid=`chk_${idx++}`;rows+=`<tr id="row_${uid}"><td class="check-cell"><input type="checkbox" class="chk" id="${uid}" onchange="toggleCheck('${uid}')"></td><td><div class="ing-nom" style="font-weight:500">${l.ing.nomRecette}${l.ing.bio?'<span class="bio-tag">BIO</span>':''}</div><div style="font-size:11px;color:var(--gris)">${l.ing.nomEtiquette||''}</div></td><td><span class="tag-four ${grp.prio?'prioritaire':''}">${fnm}</span></td><td><span class="qte">${fqte(l.qte)} ${l.u}</span></td><td style="font-size:12px">${l.recs.map(r=>`<span class="tr">${r}</span>`).join('')}</td></tr>`}
  }
  return`<div class="bc"><div class="bch" style="background:#1a2e24"><div><div class="fn">✅ Récapitulatif — Veille de production</div><div class="fc">Cochez chaque ingrédient confirmé en stock ou commandé</div></div><div class="ji"><div>Total : <strong id="recap-count">0 / ${total}</strong></div></div></div><div style="padding:16px 20px 0"><div class="recap-stats"><div class="recap-stat"><span class="rs-val" id="recap-ok-count">0</span><span class="rs-lbl">✅ Confirmés</span><div class="recap-progress"><div class="recap-progress-bar" id="recap-bar" style="width:0%"></div></div></div><div class="recap-stat"><span class="rs-val" id="recap-remaining">${total}</span><span class="rs-lbl">⏳ Restants</span></div><div class="recap-stat"><span class="rs-val">${total}</span><span class="rs-lbl">📋 Total</span></div></div></div><table class="recap-table"><thead><tr><th>✓</th><th>Ingrédient</th><th>Fournisseur</th><th>Quantité</th><th>Parfums</th></tr></thead><tbody>${rows}</tbody></table><div class="bf"><button class="btn btn-s btn-sm" onclick="toutCocher()">✅ Tout cocher</button><button class="btn btn-s btn-sm" onclick="toutDecocher()">↩ Réinitialiser</button></div></div>`;
}

function toggleCheck(uid){const c=document.getElementById(uid);const row=document.getElementById(`row_${uid}`);if(c&&row){row.classList.toggle('checked',c.checked);majCompteurs()}}
function majCompteurs(){const cs=document.querySelectorAll('.chk');const total=cs.length,done=[...cs].filter(c=>c.checked).length,pct=total?Math.round(done/total*100):0;const el=id=>document.getElementById(id);if(el('recap-count'))el('recap-count').textContent=`${done} / ${total}`;if(el('recap-ok-count'))el('recap-ok-count').textContent=done;if(el('recap-remaining'))el('recap-remaining').textContent=total-done;if(el('recap-bar'))el('recap-bar').style.width=pct+'%'}
function toutCocher(){document.querySelectorAll('.chk').forEach(c=>{c.checked=true;const row=document.getElementById(`row_${c.id}`);if(row)row.classList.add('checked')});majCompteurs()}
function toutDecocher(){document.querySelectorAll('.chk').forEach(c=>{c.checked=false;const row=document.getElementById(`row_${c.id}`);if(row)row.classList.remove('checked')});majCompteurs()}

// ── Emails ──
function emailsHtml(parFour){
  const cibles=S.fournisseurs.filter(f=>parFour[f.id]);if(!cibles.length)return'';
  const dates=[...new Set(S.planning.map(p=>p.date).filter(Boolean))];
  const periode=dates.length>=2?`du ${dates[0]} au ${dates[dates.length-1]}`:dates[0]||S.semaine;
  return cibles.map(fou=>{
    const email=fou.contact?.match(/[\w.+-]+@[\w.-]+\.\w+/)?.[0]||'';
    let liste='';
    if(estLivraisonJour(fou.nom)){
      // Email structuré par jour de livraison
      const lines=buildLivraisonLines(fou.id,fou.nom);
      let lastJour='';
      for(const line of lines){
        if(line.livraisonJour!==lastJour){
          lastJour=line.livraisonJour;
          liste+=`${liste?'\n':''}${dateDeJour(line.livraisonJour)}\n`;
        }
        const typeLabel=line.type==='frais'?'🟢 Frais':'❄️ Surgelé';
        const qteLabel=line.colisageDisplay?line.colisageDisplay:`${fqte(line.q)} ${line.u}`;
        const besoinInfo=line.neededKg?` (besoin : ${fqte(line.neededKg)} kg)`:'';
        liste+=`${qteLabel}  ${line.ing.nomRecette}${line.ing.bio?' BIO':''}  ${typeLabel}${besoinInfo}\n`;
      }
    } else {
      liste=parFour[fou.id].lignes.map(l=>`  - ${l.ing.nomRecette}${l.ing.bio?' (BIO)':''} : ${fqte(l.qte)} ${l.u}`).join('\n');
    }
    const corps=`Bonjour,\n\nVeuillez trouver ci-dessous notre commande pour la semaine ${S.semaine} (${periode}) :\n${liste}\nMerci de confirmer la réception et les dates de livraison.\n\nCordialement,\nLa Tropicale Glacier`;
    return`<div class="ec"><div class="ech"><div class="et">✉️ ${fou.nom}</div><div style="font-size:11px;opacity:.7">${estLivraisonJour(fou.nom)?'À envoyer le lundi matin':fou.jourCommande?`À envoyer le : ${cap(fou.jourCommande)}`:''}</div></div><div class="ef"><div class="efl"><label>À</label><div class="v"><input type="text" id="eto_${fou.id}" value="${email}" placeholder="email@fournisseur.fr" style="max-width:400px"></div></div><div class="efl"><label>Objet</label><div class="v"><input type="text" id="esub_${fou.id}" value="Commande La Tropicale Glacier — semaine ${S.semaine}" style="max-width:500px"></div></div></div><div class="eb"><textarea id="ebod_${fou.id}">${corps}</textarea></div><div class="ef2"><button class="btn btn-s btn-sm" onclick="copierEmail('${fou.id}')">📋 Copier</button><button class="btn btn-p btn-sm" onclick="ouvrirEmail('${fou.id}')">📨 Ouvrir dans la messagerie</button></div></div>`;
  }).join('');
}

// ── Copier ──
function copierBonLivraison(btn){
  const d=btn.closest('.bc');
  const fouNom=d.dataset.fn;
  const lines=JSON.parse(d.dataset.dl||'[]');
  let t=`BON DE COMMANDE — ${fouNom}\nSemaine ${S.semaine} — Envoi Lundi matin\n${'─'.repeat(50)}\n`;
  let lastJour='';
  for(const l of lines){
    if(l.lj!==lastJour){lastJour=l.lj;t+=`\nLIVRAISON ${cap(l.lj).toUpperCase()} :\n`}
    const typeLabel=l.type==='frais'?'🟢 Frais':'❄️ Surgelé';
    t+=`  ${l.n}${l.bio?' (BIO)':''} — ${typeLabel} : ${l.q} ${l.u}  [${l.recs.join(', ')}]\n`;
  }
  navigator.clipboard.writeText(t).then(()=>toast('Bon copié !'));
}
function copierBon(btn){const d=btn.closest('.bc');const ll=JSON.parse(d.dataset.dl||'[]');let t=`BON DE COMMANDE — ${d.dataset.fn}\nSemaine ${S.semaine}\n${'─'.repeat(40)}\n`;for(const l of ll)t+=`${l.n.padEnd(30)} ${(l.q+' '+l.u).padStart(10)}\n`;navigator.clipboard.writeText(t).then(()=>toast('Bon copié !'))}
function copierDivers(btn){const d=btn.closest('.bc');const ll=JSON.parse(d.dataset.dl||'[]');let t=`AUTRES FOURNISSEURS — Semaine ${S.semaine}\n${'─'.repeat(40)}\n`;for(const l of ll)t+=`${l.n.padEnd(28)} [${(l.f||'').padEnd(18)}] ${(l.q+' '+l.u).padStart(8)}\n`;navigator.clipboard.writeText(t).then(()=>toast('Copié !'))}
function copierEmail(fid){const to=document.getElementById(`eto_${fid}`)?.value||'';const sb=document.getElementById(`esub_${fid}`)?.value||'';const bd=document.getElementById(`ebod_${fid}`)?.value||'';navigator.clipboard.writeText(`À : ${to}\nObjet : ${sb}\n\n${bd}`).then(()=>toast('Email copié !'))}
function ouvrirEmail(fid){const to=encodeURIComponent(document.getElementById(`eto_${fid}`)?.value||'');const sb=encodeURIComponent(document.getElementById(`esub_${fid}`)?.value||'');const bd=encodeURIComponent(document.getElementById(`ebod_${fid}`)?.value||'');window.location.href=`mailto:${to}?subject=${sb}&body=${bd}`}
function copierTout(){const bons=document.querySelectorAll('.bc');let t=`BONS DE COMMANDE — La Tropicale Glacier\nSemaine ${S.semaine}\n${'═'.repeat(50)}\n\n`;for(const d of bons){const ll=JSON.parse(d.dataset.dl||'[]');if(!ll.length)continue;t+=`▶ ${d.dataset.fn||''}\n${'─'.repeat(40)}\n`;for(const l of ll)t+=`  ${(l.n||'').padEnd(28)} ${((l.q||'')+' '+(l.u||'')).padStart(10)}\n`;t+='\n'}navigator.clipboard.writeText(t).then(()=>toast('Tout copié !'))}

window.addEventListener('DOMContentLoaded',()=>{chargerConfig();initSelect()});
</script>
